name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:sdk:node
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:sdk:python
      - run: npm run pack:clean
      - run: npm run pack:check
      - run: npm run audit:release

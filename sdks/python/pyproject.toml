[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "authenchain"
version = "0.4.0"
description = "Official Python SDK for AuthenChain provenance and regulatory evidence workflows."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "AuthenChain" }
]
keywords = [
  "authenchain",
  "ai",
  "provenance",
  "attestation",
  "regulatory-evidence"
]
dependencies = []

[project.urls]
Homepage = "https://api.authenchain.com/docs/mcp"
Repository = "https://github.com/ArthurCaetanodeAlmeida/authenchain-developer-platform"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
authenchain = ["py.typed"]
